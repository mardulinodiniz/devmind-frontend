<!DOCTYPE html>
<html lang="pt"><head><link
    rel="icon"
    type="image/png"
    href="assets/favicon.png"
><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Criar conta | DevMind</title>
<link rel="stylesheet" href="Css/style.css">
</head>
<body class="auth-body">
    <main class="auth-wrap">
<div class="auth-brand">
    <div class="logo">Dev<span>Mind</span>
    </div>
    <p>Comece a construir o seu caminho na tecnologia.</p>
</div>
<section class="auth-card">
    <h1>Crie a sua conta</h1>
    <p>Tenha acesso aos conteúdos e acompanhe a sua evolução.</p>
<div id="mensagem" class="mensagem">

</div>
<form id="formCadastro">
    <div class="campo">
        <label>Nome completo</label>
        <input id="nome" required placeholder="Seu nome">
    </div>
<div class="campo">
    <label>Email</label>
    <input type="email" id="email" required placeholder="seu@email.com">
</div>
<div class="campo">
    <label>Senha</label>
    <input type="password" id="senha" required minlength="6" placeholder="Mínimo de 6 caracteres">
</div>
<button id="btnCadastro" class="btn btn-primary" style="width:100%" type="submit">Criar minha conta</button>
</form>
<div class="auth-footer">
    Já possui uma conta? <a href="login.html">Entrar</a>
</div>
</section>
</main>
<script src="Js/api.js"></script>
<script>
const form=document.getElementById('formCadastro'),msg=document.getElementById('mensagem'),btn=document.getElementById('btnCadastro');
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='mensagem';btn.disabled=true;btn.textContent='Criando conta...';
try{await cadastrarUsuario(nome.value.trim(),email.value.trim(),senha.value);msg.className='mensagem sucesso';msg.textContent='Conta criada com sucesso! Agora faça login.';setTimeout(()=>location.href='login.html',900)}
catch(err){msg.className='mensagem erro';msg.textContent=err.message;btn.disabled=false;btn.textContent='Criar minha conta'}});
</script></body></html>
