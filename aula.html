<!DOCTYPE html>
<html lang="pt">

<head>
    <link
    rel="icon"
    type="image/png"
    href="assets/favicon.png"
>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Aula | DevMind</title>
    <link
        rel="stylesheet"
        href="Css/aula.css"
    >
</head>

<body>


    <!-- CABEÇALHO -->

    <header class="navbar">

         <a class="logo" href="index.html">
            <img src="assets/logo.png" alt="DevMind">
        </a>


        <nav>

            <a href="index.html">
                Início
            </a>

            <a
                id="linkCurso"
                href="curso.html"
            >
                Curso
            </a>

            <a href="dashboard.html">
                Dashboard
            </a>

        </nav>


        <div class="acoes">

            <button
                class="btn-login"
                onclick="sair()"
            >
                Sair
            </button>

        </div>

    </header>


    <!-- CONTEÚDO DA AULA -->

    <main class="pagina-aula">


        <!-- VOLTAR -->

        <a
            id="voltarModulo"
            href="modulo.html"
            class="voltar"
        >

            ← Voltar para o módulo

        </a>


        <!-- CABEÇALHO DA AULA -->

        <section class="aula-cabecalho">


            <span class="etiqueta">
                DEV MIND • AULA
            </span>


            <h1 id="tituloAula">

                Carregando aula...

            </h1>


            <p id="descricaoAula">

                Aguarde enquanto carregamos
                o conteúdo da aula.

            </p>


        </section>


        <!-- VÍDEO -->

        <section class="video-container">


            <div
                id="areaVideo"
                class="video-aula"
            >

                <div class="video-carregando">

                    Carregando vídeo...

                </div>

            </div>


        </section>


        <!-- PROGRESSO -->

        <section class="progresso-aula">


            <div>

                <span class="etiqueta">
                    SEU PROGRESSO
                </span>


                <h2>
                    Continue evoluindo
                </h2>


                <p>
                    Quando terminar a aula,
                    marque-a como concluída.

                </p>

            </div>


            <button
                id="btnConcluir"
                class="btn-principal"
            >

                Marcar como concluída

            </button>


        </section>


    </main>


    <script src="js/api.js"></script>

    <script src="js/aula.js"></script>


</body>

</html>
