<!DOCTYPE html>
<html lang="pt"><head><link
    rel="icon"
    type="image/png"
    href="assets/favicon.png"
><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Entrar | DevMind</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-body"><main class="auth-wrap">
<div class="auth-brand"><div class="logo">Dev<span>Mind</span></div><p>Desenvolva a mente. Construa o caminho para dominar a tecnologia.</p></div>
<section class="auth-card"><h1>Bem-vindo de volta</h1><p>Entre na sua conta e continue evoluindo nos seus estudos.</p>
<div id="mensagem" class="mensagem"></div>
<form id="formLogin"><div class="campo"><label>Email</label><input type="email" id="email" placeholder="seu@email.com" required></div>
<div class="campo"><label>Senha</label><div class="senha-container"><input type="password" id="senha" placeholder="Digite sua senha" required><button type="button" id="mostrarSenha" class="mostrar-senha">Mostrar</button></div></div>
<button id="btnLogin" class="btn btn-primary" style="width:100%" type="submit">Entrar na plataforma</button></form>
<div class="auth-footer">Ainda não possui uma conta? <a href="cadastro.html">Criar conta gratuitamente</a></div></section>
</main><script src="js/api.js"></script><script>
const form=document.getElementById('formLogin'), msg=document.getElementById('mensagem'), btn=document.getElementById('btnLogin');
const senha=document.getElementById('senha'), mostrar=document.getElementById('mostrarSenha');
mostrar.onclick=()=>{const aberto=senha.type==='password';senha.type=aberto?'text':'password';mostrar.textContent=aberto?'Ocultar':'Mostrar'};
form.addEventListener('submit',async e=>{e.preventDefault();msg.className='mensagem';btn.disabled=true;btn.textContent='Entrando...';
try{await fazerLogin(document.getElementById('email').value.trim(),senha.value);msg.className='mensagem sucesso';msg.textContent='Login realizado com sucesso!';setTimeout(()=>location.href='dashboard.html',500)}
catch(err){msg.className='mensagem erro';msg.textContent=err.message;btn.disabled=false;btn.textContent='Entrar na plataforma'}});
</script></body></html>
